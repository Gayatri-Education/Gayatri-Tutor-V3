<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gayatri AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 60px;
      background: #16213e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      flex-shrink: 0;
    }
    .sidebar-logo {
      width: 36px;
      height: 36px;
      background: #e94560;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: white;
      margin-bottom: 16px;
    }
    .sidebar-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #8a8a9a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      font-size: 18px;
      transition: all 0.15s;
    }
    .sidebar-btn:hover { background: #1a1a3e; color: #e0e0e0; }
    .sidebar-btn.active { background: #e94560; color: white; }

    /* ── Main area ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Titlebar ── */
    .titlebar {
      height: 36px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    .titlebar-text { font-size: 12px; color: #8a8a9a; }
    .titlebar-controls { display: flex; gap: 8px; -webkit-app-region: no-drag; }
    .titlebar-btn {
      width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer;
    }
    .btn-minimize { background: #f5c542; }
    .btn-maximize { background: #27c93f; }
    .btn-close { background: #e94560; }

    /* ── Agent bar ── */
    .agent-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #1a1a3e;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .agent-label { font-size: 11px; color: #8a8a9a; }
    .agent-select {
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      outline: none;
    }
    .model-badge {
      margin-left: auto;
      font-size: 11px;
      background: #0f3460;
      color: #53a8b6;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* ── Chat area ── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #e94560;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #1a1a3e;
      border: 1px solid #2a2a4a;
      border-bottom-left-radius: 4px;
    }
    .message.system {
      align-self: center;
      background: transparent;
      color: #8a8a9a;
      font-size: 12px;
      max-width: 90%;
    }
    .message-agent-tag {
      font-size: 10px;
      color: #53a8b6;
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* ── Input area ── */
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #16213e;
      border-top: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f0f23;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus { border-color: #e94560; }
    .send-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .send-btn:hover { background: #c73e54; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Status indicator ── */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.ready { background: #27c93f; }
    .status-dot.loading { background: #f5c542; animation: pulse 1s infinite; }
    .status-dot.error { background: #e94560; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">G</div>
      <button class="sidebar-btn active" title="Chat" onclick="switchTab('chat', this)">💬</button>
      <button class="sidebar-btn" title="Agents" onclick="switchTab('agents', this)">🤖</button>
      <button class="sidebar-btn" title="Courses" onclick="switchTab('courses', this)">📚</button>
      <button class="sidebar-btn" title="Settings" onclick="switchTab('settings', this)">⚙️</button>
    </div>

    <!-- Main -->
    <div class="main">
      <!-- Titlebar -->
      <div class="titlebar">
        <span class="titlebar-text">Gayatri AI — Local Mode</span>
        <div class="titlebar-controls">
          <button class="titlebar-btn btn-minimize" onclick="minimizeWindow()" title="Minimize"></button>
          <button class="titlebar-btn btn-maximize" onclick="maximizeWindow()" title="Maximize / Restore"></button>
          <button class="titlebar-btn btn-close" onclick="closeWindow()" title="Close"></button>
        </div>
      </div>

      <!-- Agent bar -->
      <div class="agent-bar">
        <span class="agent-label">Agent:</span>
        <select class="agent-select" id="agentSelect">
          <option value="auto">🤖 Auto-detect</option>
        </select>
        <span class="model-badge" id="modelBadge">
          <span class="status-dot loading" id="statusDot"></span>
          <span id="statusText">Loading model...</span>
        </span>
      </div>

      <!-- Chat -->
      <div class="chat" id="chat">
        <div class="message system">
          Welcome to Gayatri AI. Type a message to start chatting,
          or use /commands to invoke specific agents.
          Type /help to see available commands.
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message or /command..."
               autocomplete="off" onkeydown="if(event.key==='Enter')send()">
        <button class="send-btn" id="sendBtn" onclick="send()">Send</button>
      </div>
    </div>
  </div>

  <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
  <script>
    var bridge = null;
    var isGenerating = false;
    var currentTokens = [];

    // ── QWebChannel setup ──
    new QWebChannel(qt.webChannelTransport, function(channel) {
      bridge = channel.objects.bridge;

      // Signal handlers
      bridge.token.connect(function(idx, text) {
        currentTokens.push(text);
        updateLastMessage();
      });
      bridge.done.connect(function() {
        isGenerating = false;
        updateSendButton();
      });
      bridge.error.connect(function(msg) {
        addMessage('system', 'Error: ' + msg);
        isGenerating = false;
        updateSendButton();
      });

      // Check model status
      updateModelStatus();
    });

    // ── Model status ──
    function updateModelStatus() {
      try {
        var status = JSON.parse(bridge.get_local_model_status());
        var dot = document.getElementById('statusDot');
        var text = document.getElementById('statusText');
        if (status.installed) {
          dot.className = 'status-dot ready';
          text.textContent = 'Ready — ' + (status.size_mb / 1024).toFixed(1) + ' GB';
        } else {
          dot.className = 'status-dot error';
          text.textContent = 'Model not found';
        }
      } catch(e) {}
    }

    // ── Chat functions ──
    function send() {
      if (isGenerating) return;
      if (!bridge) {
        addMessage('system', 'Connection initializing. Please wait a moment...');
        return;
      }
      var input = document.getElementById('userInput');
      var msg = input.value.trim();
      if (!msg) return;

      addMessage('user', msg);
      addMessage('assistant', '');
      input.value = '';
      isGenerating = true;
      updateSendButton();
      currentTokens = [];

      bridge.send_message(msg);
    }

    function addMessage(role, text, agentName) {
      var chat = document.getElementById('chat');
      var div = document.createElement('div');
      div.className = 'message ' + role;

      if (agentName) {
        var tag = document.createElement('div');
        tag.className = 'message-agent-tag';
        tag.textContent = '🤖 ' + agentName;
        div.appendChild(tag);
      }

      var content = document.createElement('div');
      content.className = 'message-content';
      content.textContent = text;
      div.appendChild(content);

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function updateLastMessage() {
      var chat = document.getElementById('chat');
      var msgs = chat.querySelectorAll('.message.assistant');
      var last = msgs[msgs.length - 1];
      if (!last) {
        addMessage('assistant', '');
        last = chat.querySelector('.message.assistant:last-child');
      }
      var content = last.querySelector('.message-content');
      if (content) {
        content.textContent = currentTokens.join('');
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function updateSendButton() {
      var btn = document.getElementById('sendBtn');
      btn.disabled = isGenerating;
      btn.textContent = isGenerating ? '...' : 'Send';
    }

    function switchTab(tab, el) {
      document.querySelectorAll('.sidebar-btn').forEach(function(b) {
        b.classList.remove('active');
      });
      var target = el || (typeof event !== 'undefined' ? (event.currentTarget || event.target) : null);
      if (target) {
        target.classList.add('active');
      }
    }

    // ── Window Controls (Frameless UI) ──
    function minimizeWindow() {
      if (bridge && typeof bridge.minimize_window === 'function') {
        bridge.minimize_window();
      }
    }

    function maximizeWindow() {
      if (bridge && typeof bridge.maximize_window === 'function') {
        bridge.maximize_window();
      }
    }

    function closeWindow() {
      if (bridge && typeof bridge.close_window === 'function') {
        bridge.close_window();
      }
    }

    // Focus input on load
    document.getElementById('userInput').focus();
  </script>
</body>
</html>
