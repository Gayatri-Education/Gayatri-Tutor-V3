[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gayatri-ai"
version = "3.0.0"
description = "Gayatri AI — Local-first agentic AI platform with fine-tuned LLM"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12,<3.13"
authors = [{name = "Gayatri Education"}]

dependencies = [
    "PySide6>=6.11.0",
    "llama-cpp-python>=0.3.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
    "rank-bm25>=0.2.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "pydantic>=2.0.0",
]

[project.optional-deps]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
]
rag = [
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
]
cuda = [
    "llama-cpp-python[cuda]>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "S", "T20", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
